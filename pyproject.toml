[project]
name = "Photon"
version = "0.1.0"
description = "LLM-Driven Image Feature/Transformation Visualizer — Flask + Gemini/OpenAI + sandboxed code execution"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.7.2",
    "flask>=3.1.3",
    "google-genai>=1.0.0",
    "gunicorn>=26.0.0",
    "numpy>=2.5.1",
    "openai>=1.30.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.6.0",
    "pydensecrf2>=1.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.0",
    "tifffile>=2026.6.1",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "waitress>=3.0.2",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.3,<3",
]

# PyTorch must come from the CUDA 12.1 build index — the default PyPI wheels
# don't work in this container. `explicit = true` means ONLY the packages
# mapped below are pulled from here; everything else still resolves via PyPI.
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[tool.pyright]
include = ["src"]
extraPaths = ["."]
executionEnvironments = [
  { root = "." }
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:datetime.datetime.utcnow:DeprecationWarning"]
markers = ["slow: spawns sandbox subprocesses or an MCP server (deselect with -m 'not slow')"]
