<!-- Session Pane — unified chat + code (D-021). A session has no locked mode:
     both sub-views stay mounted (x-show) and share the same images/outputs. -->
<div class="flex flex-col h-full overflow-hidden w-full">

  <!-- Session header: editable title + toolbar -->
  <div class="flex items-center justify-between gap-3 px-4 sm:px-6 py-3 border-b border-gray-800 shrink-0 bg-gray-950">
    <div class="flex items-center gap-2 min-w-0 flex-1">
      <template x-if="!editingTitle">
        <button @click="startEditTitle()" class="text-sm font-semibold text-gray-100 hover:text-white truncate max-w-full text-left" x-text="activeSessionData.title" title="Click to rename"></button>
      </template>
      <template x-if="editingTitle">
        <input type="text" x-model="titleDraft" @keydown.enter="saveTitle()" @keydown.escape="editingTitle = false" @blur="saveTitle()"
               x-init="$nextTick(() => $el.focus())"
               class="bg-gray-800 border border-indigo-500 rounded px-2 py-0.5 text-sm text-gray-100 focus:outline-none w-full max-w-md" />
      </template>
    </div>
    <div class="flex items-center gap-3 sm:gap-4 shrink-0">
      <button @click="$store.shareDialog.open(sess.session_id)" class="text-xs text-gray-400 hover:text-indigo-400 transition-colors flex items-center gap-1" title="Share (creates a clone-able link)">
        <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
        </svg>
        <span class="hidden sm:inline">Share</span>
      </button>
      <button @click="$store.downloadDialog.open(sess.session_id)" class="text-xs text-gray-400 hover:text-indigo-400 transition-colors flex items-center gap-1" title="Download this session's outputs">
        <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3M3 17V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        </svg>
        <span class="hidden sm:inline">Download</span>
      </button>
      <button @click="deleteSession(sess.session_id)" class="text-xs text-gray-400 hover:text-red-400 transition-colors flex items-center gap-1" title="Delete this session">
        <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
        <span class="hidden sm:inline">Delete</span>
      </button>
    </div>
  </div>

  <!-- Stacks vertically below lg; side-by-side with draggable split at lg+ -->
  <div class="flex flex-col lg:flex-row flex-1 min-h-0 overflow-hidden w-full">

    <!-- Left/Middle: Images -->
    <div class="flex-1 min-w-0 min-h-0 flex flex-col p-4 sm:p-6 bg-gray-950 border-b lg:border-b-0 lg:border-r border-gray-800 overflow-y-auto custom-scrollbar">
      {% include "partials/image_compare.html" %}
      <!-- Add image -->
      <div class="shrink-0 pt-4">
        <input type="file" x-ref="addImageInput" class="hidden" accept=".png,.jpg,.jpeg,.tif,.tiff,.npy,.bmp,.webp"
               @change="addImage($event.target.files[0]); $event.target.value = ''" />
        <button @click="$refs.addImageInput.click()" :disabled="addingImage"
                class="btn-secondary text-xs px-3 py-1.5 flex items-center gap-1.5 disabled:opacity-50">
          <span x-show="!addingImage">+ Add Image</span>
          <span x-show="addingImage" class="flex items-center gap-1.5">
            <span class="animate-spin w-3 h-3 border-2 border-gray-400 border-t-transparent rounded-full"></span> Uploading...
          </span>
        </button>
      </div>
    </div>

    <!-- Right: Chat/Code Panel. Full-width, 55%-height block when stacked (below lg);
         drag-resizable width via --panel-w at lg+ (handle hidden when stacked). -->
    <div class="relative shrink-0 flex flex-col bg-gray-900 p-4 gap-3 w-full h-[55%] lg:h-full lg:w-[var(--panel-w)]"
         :class="{'llm-halo': running}"
         :style="`--panel-w: ${panelWidthPct}%`">
      <div class="panel-resize-handle hidden lg:block" :class="{'dragging': panelDragging}" @mousedown.prevent="startPanelDrag($event)" title="Drag to resize"></div>

      <!-- Toolbar: mode toggle -->
      <div class="flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2">
          <div class="flex bg-gray-800 rounded-lg p-0.5 text-xs font-medium">
            <button @click="viewMode = 'chat'" :class="viewMode === 'chat' ? 'bg-indigo-600 text-white' : 'text-gray-400 hover:text-gray-200'" class="px-2.5 py-1 rounded-md transition-colors">💬 Chat</button>
            <button @click="viewMode = 'code'" :class="viewMode === 'code' ? 'bg-indigo-600 text-white' : 'text-gray-400 hover:text-gray-200'" class="px-2.5 py-1 rounded-md transition-colors">&lt;/&gt; Code</button>
          </div>
          <span class="text-xs text-gray-500" x-text="sess.images.length > 1 ? `Batch: ${sess.images.length} images` : (sess.image_id ? 'Image: ' + sess.image_id.slice(0, 8) + '...' : '')"></span>
        </div>
        <div class="flex items-center gap-3">
          <template x-if="viewMode === 'code'">
            <button @click="$store.codeDialog.open('Example Code', 'A simple starting point', 'def main(input_path: str, output_path_dir: str) -> str:\n    import os, cv2\n    # Example implementation\n    return os.path.join(output_path_dir, \'out.jpg\')', 'example')" class="btn-secondary text-xs px-2 py-1">
              Example
            </button>
          </template>
          <button @click="showMeta = !showMeta" class="text-xs text-gray-500 hover:text-gray-300 transition-colors">
            <span x-text="showMeta ? 'Hide' : 'Show'"></span> Metadata
          </button>
        </div>
      </div>

      <!-- Collapsible Metadata -->
      <div x-show="showMeta" x-transition class="shrink-0">
        <div x-data="{ metadata: sess.metadata, copied: false, copyMetadata() { copyTextToClipboard(JSON.stringify(this.metadata, null, 2)).then(ok => { if (!ok) return; this.copied = true; setTimeout(() => this.copied = false, 2000); }); } }">
          {% include "partials/metadata_block.html" %}
        </div>
      </div>

      <!-- ============ CHAT SUB-VIEW ============ -->
      <div x-show="viewMode === 'chat'" class="flex-1 flex flex-col min-h-0 gap-3">

        <div class="flex-1 overflow-y-auto overflow-x-hidden custom-scrollbar space-y-3 pr-1 min-w-0 break-words" x-ref="chatHistory">
          <template x-for="(msg, i) in messages" :key="i">
            <div class="flex w-full" :class="msg.role === 'user' ? 'justify-end' : 'justify-start'">

              <!-- USER MESSAGE -->
              <template x-if="msg.role === 'user'">
                <div class="bg-indigo-700 text-white rounded-xl rounded-tr-sm px-4 py-2 max-w-[85%] text-sm whitespace-pre-wrap" x-text="msg.content"></div>
              </template>

              <!-- ASSISTANT CHAT BUBBLE -->
              <template x-if="msg.role === 'assistant' && msg.response_type === 'chat'">
                <div class="bg-gray-800 text-gray-100 rounded-xl rounded-tl-sm px-4 py-2 max-w-[85%] text-sm flex flex-col gap-2 shadow-sm border border-gray-700/50">
                  <div x-markdown="msg.content"></div>
                  <template x-if="msg.code">
                    <div class="bg-[#282a36] p-3 rounded border border-gray-700 mt-1 relative group">
                      <pre class="dracula-block text-xs m-0"><code x-highlight="msg.code"></code></pre>
                      <div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity flex gap-2">
                        <button @click="runSnippet(msg.code)" class="px-2 py-1 bg-indigo-600 hover:bg-indigo-500 rounded text-xs text-white shadow" title="Run in Sandbox">Run</button>
                        <button @click="$store.codeDialog.open('Illustrative Snippet', 'Generated by LLM', msg.code, 'viewer')" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-xs text-white shadow">View Full</button>
                      </div>
                    </div>
                  </template>
                </div>
              </template>

              <!-- ASSISTANT CODE CARD -->
              <template x-if="msg.role === 'assistant' && msg.response_type === 'code'">
                <div class="bg-gray-800 text-gray-100 rounded-xl rounded-tl-sm w-full max-w-full text-sm flex flex-col shadow-sm border border-gray-700/50 overflow-hidden">
                  <div class="px-4 py-3 bg-gray-900/50 border-b border-gray-700/50 flex items-start justify-between gap-4">
                    <div class="flex-1 text-gray-300" x-markdown="msg.content"></div>
                    <div class="shrink-0 flex items-center gap-2">
                      <template x-if="msg.outputs && msg.outputs.length > 0">
                        <button @click="previewOutputs(msg)" class="text-xs text-emerald-400 hover:text-emerald-300 font-medium px-2 py-1 bg-emerald-500/10 rounded">Preview Output</button>
                      </template>
                      <button @click="$store.codeDialog.open('Generated Code', 'Executed by sandbox', msg.code, 'viewer')" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium px-2 py-1 bg-indigo-500/10 rounded">Preview Code</button>
                    </div>
                  </div>
                  <template x-if="!msg.was_executed">
                    <div class="px-4 py-2 bg-amber-500/10 text-amber-500/80 text-xs font-mono flex items-center gap-2">
                      <span class="animate-spin w-3 h-3 border-2 border-amber-500/50 border-t-transparent rounded-full"></span> Running...
                    </div>
                  </template>
                  <template x-if="msg.was_executed && msg.execution_result">
                    <div class="px-4 py-2 flex items-center gap-2 text-xs font-mono"
                         :class="msg.execution_result.file_exists ? 'bg-green-500/10 text-green-400' : 'bg-red-500/10 text-red-400'">
                      <span x-text="msg.execution_result.file_exists ? '✓ Run Succeeded' : '✗ Run Failed'"></span>
                      <span class="text-gray-500 ml-auto" x-text="`${msg.execution_result.time_taken_seconds?.toFixed(2) || '0.00'}s`"></span>
                    </div>
                  </template>
                </div>
              </template>

              <!-- ASSISTANT PIPELINE CARD (v3 P2) -->
              <template x-if="msg.role === 'assistant' && msg.response_type === 'pipeline'">
                <div class="bg-gray-800 text-gray-100 rounded-xl rounded-tl-sm w-full max-w-full text-sm flex flex-col shadow-sm border border-gray-700/50 overflow-hidden">
                  <div class="px-4 py-3 bg-gray-900/50 border-b border-gray-700/50 flex items-start justify-between gap-4">
                    <div class="flex-1 text-gray-300" x-markdown="msg.content"></div>
                    <div class="shrink-0 flex items-center gap-2">
                      <template x-if="msg.outputs && msg.outputs.length > 0">
                        <button @click="previewOutputs(msg)" class="text-xs text-emerald-400 hover:text-emerald-300 font-medium px-2 py-1 bg-emerald-500/10 rounded">Preview Output</button>
                      </template>
                      <button @click="$store.codeDialog.open('Pipeline Graph', 'JSON definition', JSON.stringify(msg.pipeline, null, 2), 'viewer')" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium px-2 py-1 bg-indigo-500/10 rounded">View Graph</button>
                    </div>
                  </div>

                  <!-- node chain -->
                  <div class="px-4 py-3 flex flex-wrap items-center gap-1.5">
                    <span class="text-[10px] uppercase tracking-wide text-gray-500 mr-1">input</span>
                    <template x-for="(node, ni) in (msg.pipeline?.nodes || [])" :key="node.id">
                      <div class="flex items-center gap-1.5">
                        <svg class="w-3 h-3 text-gray-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                        <span class="px-2 py-0.5 rounded text-[11px] font-mono border transition-colors"
                              :class="{
                                'bg-emerald-500/10 border-emerald-500/40 text-emerald-300': msg.nodeStatus?.[node.id] === 'done',
                                'bg-amber-500/10 border-amber-500/40 text-amber-300 animate-pulse': msg.nodeStatus?.[node.id] === 'start',
                                'bg-red-500/10 border-red-500/40 text-red-300': msg.nodeStatus?.[node.id] === 'error',
                                'bg-gray-900 border-gray-700 text-gray-400': !msg.nodeStatus?.[node.id]
                              }"
                              :title="node.id"
                              x-text="pipelineNodeLabel(node)"></span>
                      </div>
                    </template>
                  </div>

                  <!-- per-node previews -->
                  <template x-if="msg.nodePreviews && Object.keys(msg.nodePreviews).length">
                    <div class="px-4 pb-3 flex gap-2 overflow-x-auto custom-scrollbar">
                      <template x-for="[nid, url] in Object.entries(msg.nodePreviews)" :key="nid">
                        <div class="shrink-0 w-16">
                          <img :src="url" :alt="nid" class="w-16 h-12 object-cover rounded border border-gray-700 cursor-pointer"
                               @click="$dispatch('view-carousel', {slides: [{url: url, label: nid, code: null}], startIndex: 0})" />
                          <p class="text-[9px] text-gray-500 truncate text-center mt-0.5" x-text="nid"></p>
                        </div>
                      </template>
                    </div>
                  </template>

                  <!-- non-image outputs (first image) -->
                  <template x-if="msg.nodeValues && Object.keys(msg.nodeValues).length">
                    <div class="px-4 pb-3 space-y-0.5">
                      <template x-for="[nid, ports] in Object.entries(msg.nodeValues)" :key="nid">
                        <template x-for="[port, v] in Object.entries(ports)" :key="nid + port">
                          <p class="text-[11px] font-mono text-gray-400 break-all">
                            <span class="text-gray-500" x-text="`${nid}.${port} = `"></span><span x-text="(JSON.stringify(v) || '').slice(0, 300)"></span>
                          </p>
                        </template>
                      </template>
                    </div>
                  </template>

                  <!-- validation issues -->
                  <template x-if="msg.pipelineIssues && msg.pipelineIssues.length">
                    <div class="px-4 py-2 bg-amber-500/10 text-amber-400 text-xs space-y-0.5">
                      <p class="font-medium">Pipeline invalid — retrying:</p>
                      <template x-for="iss in msg.pipelineIssues" :key="iss.message">
                        <p x-text="`• ${iss.node_id ? iss.node_id + ': ' : ''}${iss.message}`"></p>
                      </template>
                    </div>
                  </template>

                  <!-- runtime error -->
                  <template x-if="msg.pipelineError">
                    <div class="px-4 py-2 bg-red-500/10 text-red-400 text-xs font-mono"
                         x-text="`✗ ${msg.pipelineError.node || 'pipeline'}: ${msg.pipelineError.message}`"></div>
                  </template>

                  <!-- footer: save to library -->
                  <div class="px-4 py-2 border-t border-gray-700/50 flex items-center justify-between">
                    <span class="text-[11px] text-gray-500 truncate">
                      <span x-text="`${(msg.pipeline?.nodes || []).length} nodes`"></span>
                      <template x-if="msg.pipeline?.published">
                        <span x-text="` · shared: ${msg.pipeline.published.title} v${msg.pipeline.published.version} by ${msg.pipeline.published.owner}`"></span>
                      </template>
                    </span>
                    <template x-if="!msg.savedPipelineId">
                      <button @click="savePipelineToLibrary(msg)" :disabled="msg.savingPipeline"
                              class="text-[11px] text-gray-400 hover:text-indigo-400 transition-colors disabled:opacity-50">
                        <span x-show="!msg.savingPipeline" x-text="msg.pipeline?.published ? 'Fork to my pipelines' : 'Save to my pipelines'"></span>
                        <span x-show="msg.savingPipeline">Saving...</span>
                      </button>
                    </template>
                    <div class="flex items-center gap-3">
                      <template x-if="msg.savedPipelineId">
                        <span class="text-[11px] text-emerald-400">✓ Saved</span>
                      </template>
                      <button @click="openPipelineInEditor(msg)" :disabled="msg.savingPipeline"
                              class="text-[11px] text-gray-400 hover:text-indigo-400 transition-colors disabled:opacity-50">
                        <span x-text="msg.pipeline?.published && !msg.savedPipelineId ? 'Open shared pipeline' : 'Open in editor'"></span>
                      </button>
                    </div>
                  </div>
                </div>
              </template>

              <!-- ASSISTANT ERROR -->
              <template x-if="msg.role === 'assistant' && msg.response_type === 'error'">
                <div class="bg-red-900/20 text-red-400 border border-red-500/20 rounded-xl rounded-tl-sm px-4 py-2 max-w-[85%] text-sm whitespace-pre-wrap" x-text="msg.content"></div>
              </template>

            </div>
          </template>

          <template x-if="running">
            <div class="flex justify-start">
              <div class="bg-gray-800 rounded-xl rounded-tl-sm px-4 py-2 text-sm text-indigo-300 flex items-center gap-2">
                <span class="animate-spin inline-block w-3 h-3 border-2 border-indigo-400 border-t-transparent rounded-full"></span>
                <span x-text="statusMsg || 'Working...'"></span>
              </div>
            </div>
          </template>
        </div>

        <div class="shrink-0 border-t border-gray-800 pt-3">
          <div class="flex gap-2">
            <textarea
              x-model="inputText"
              @keydown.ctrl.enter="sendMessage()"
              @keydown.meta.enter="sendMessage()"
              :disabled="running"
              placeholder="Describe a transformation... (Ctrl+Enter to send)"
              rows="2"
              class="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500 resize-none disabled:opacity-50 custom-scrollbar">
            </textarea>
            <button x-show="!running" @click="sendMessage()" :disabled="!inputText.trim()" class="btn-primary self-end px-4 py-2">
              Send
            </button>
            <button x-show="running" @click="stopLoop()"
                    class="self-end px-4 py-2 bg-red-600 hover:bg-red-500 text-white text-sm font-medium rounded-xl transition-colors flex items-center gap-2"
                    title="Stop the generate→execute→fix loop">
              <span class="w-2.5 h-2.5 bg-white rounded-sm"></span>
              <span class="flex items-center gap-1">Stop <span class="text-red-200 text-xs" x-text="attemptLabel"></span></span>
            </button>
          </div>
        </div>
      </div>

      <!-- ============ CODE SUB-VIEW ============ -->
      <div x-show="viewMode === 'code'" class="flex-1 flex flex-col min-h-0 gap-2">
        <div class="flex items-center justify-between shrink-0">
          <span class="text-xs text-gray-500 truncate">Python · <code class="text-green-400">main(...) → str</code></span>
          <button @click="runCode()" :disabled="running" class="btn-primary text-sm px-4 py-1.5 flex items-center gap-2">
            <template x-if="!running">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </template>
            <template x-if="running">
              <span class="animate-spin w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span>
            </template>
            <span x-text="running ? 'Running...' : 'Run'"></span>
          </button>
        </div>

        <div id="editor-container" x-ref="editorContainer" class="border border-gray-700 rounded-xl overflow-hidden bg-gray-900 flex-1 min-h-0" style="font-size:13px;"></div>

        <template x-if="execResult">
          <div class="shrink-0 panel">
            <div class="flex items-center gap-2 mb-2">
              <span :class="execResult.all_success || execResult.file_exists ? 'text-emerald-400' : 'text-red-400'" class="text-sm font-medium">
                <span x-text="execResult.all_success || execResult.file_exists ? '✓ Success' : '✗ Failed'"></span>
              </span>
              <span class="text-xs text-gray-500" x-text="`${execResult.time_taken_seconds?.toFixed(2)}s`"></span>
              <span x-show="execResult.timed_out" class="text-xs text-orange-400 font-medium">TIMED OUT</span>
            </div>
            <template x-if="execResult.stderr && execResult.stderr.trim()">
              <div>
                <p class="text-xs text-gray-500 mb-1">stderr:</p>
                <pre class="code-block custom-scrollbar text-xs max-h-32 overflow-y-auto text-red-300" x-text="execResult.stderr"></pre>
              </div>
            </template>
            <template x-if="execResult.traceback">
              <div class="mt-2">
                <p class="text-xs text-gray-500 mb-1">traceback:</p>
                <pre class="code-block custom-scrollbar text-xs max-h-32 overflow-y-auto text-orange-300" x-text="execResult.traceback"></pre>
              </div>
            </template>
            <template x-if="execResult.stdout && execResult.stdout.trim()">
              <div class="mt-2">
                <p class="text-xs text-gray-500 mb-1">stdout:</p>
                <pre class="code-block custom-scrollbar text-xs max-h-20 overflow-y-auto" x-text="execResult.stdout"></pre>
              </div>
            </template>
          </div>
        </template>
      </div>

    </div>
  </div>
</div>
