<!-- Label painter (D-044): paint class labels over a session image for ml_fit / load_labels. -->
<div
  x-data="labelPainter()"
  x-show="$store.labelPainter.isOpen"
  @keydown.window="$store.labelPainter.isOpen && key($event)"
  @keydown.escape.window="$store.labelPainter.isOpen && close()"
  class="fixed inset-0 z-[65] flex items-center justify-center p-2 sm:p-4"
  x-transition
  style="display: none;">

  <div class="absolute inset-0 bg-black/80" @click="close()"></div>

  <div class="relative bg-gray-900 rounded-2xl border border-gray-700 shadow-2xl w-full max-w-6xl h-[94vh] flex flex-col overflow-hidden">

    <div class="flex items-center justify-between gap-3 px-4 sm:px-6 py-3 border-b border-gray-800 shrink-0">
      <div class="min-w-0">
        <h2 class="text-base font-semibold text-white">Paint labels</h2>
        <p class="text-xs text-gray-500 mt-0.5 truncate">
          Scribble a few strokes per class. A pipeline reads them with <code class="font-mono">load_labels</code>;
          train with <code class="font-mono">ml_fit</code> (ignore_label 0).
        </p>
      </div>
      <button @click="close()" class="text-gray-500 hover:text-white transition-colors shrink-0" title="Close (Esc)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="flex flex-col md:flex-row flex-1 min-h-0">

      <!-- Canvas -->
      <div class="flex-1 min-w-0 min-h-0 bg-gray-950 flex items-center justify-center p-3 overflow-hidden relative">
        <template x-if="loading">
          <div class="absolute inset-0 flex items-center justify-center">
            <div class="w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
          </div>
        </template>
        <div class="w-full h-full flex items-center justify-center" style="container-type: size;">
        <div class="relative" x-show="image"
             :style="W && H ? `aspect-ratio: ${W} / ${H}; width: min(100cqw, calc(100cqh * ${W} / ${H}));` : ''">
          <img :src="image && image.preview_url" alt="" class="block w-full h-full object-contain select-none pointer-events-none" draggable="false" />
          <canvas x-ref="overlay"
                  class="absolute inset-0 w-full h-full touch-none"
                  :style="`opacity: ${opacity / 100}; image-rendering: pixelated; cursor: crosshair;`"
                  @pointerdown="down($event)" @pointermove="move($event)"
                  @pointerup="up()" @pointercancel="up()" @contextmenu.prevent></canvas>
        </div>
        </div>
      </div>

      <!-- Tools -->
      <div class="w-full md:w-72 shrink-0 border-t md:border-t-0 md:border-l border-gray-800 p-4 flex flex-col gap-4 overflow-y-auto custom-scrollbar">

        <div class="flex flex-col gap-1.5">
          <span class="text-xs font-semibold text-gray-400 uppercase tracking-wide">Classes</span>
          <template x-for="c in classes" :key="c.value">
            <div class="flex items-center gap-2 rounded-lg px-2 py-1 cursor-pointer"
                 :class="current === c.value ? 'bg-gray-800 ring-1 ring-indigo-500' : 'hover:bg-gray-800/60'"
                 @click="current = c.value">
              <input type="color" x-model="c.color" @input="redraw()" @click.stop class="w-5 h-5 bg-transparent border-0 p-0 cursor-pointer" title="Colour" />
              <span class="text-[11px] text-gray-500 font-mono w-3" x-text="c.value"></span>
              <input type="text" x-model="c.name" maxlength="40" @click.stop
                     class="flex-1 min-w-0 bg-transparent text-sm text-gray-100 focus:outline-none border-b border-transparent focus:border-gray-600" />
              <span class="text-[10px] text-gray-500 tabular-nums" x-text="(counts[c.value] || 0).toLocaleString()"></span>
              <button @click.stop="removeClass(c)" class="text-gray-600 hover:text-red-400" title="Remove class">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>
          </template>
          <div class="flex gap-2">
            <button @click="addClass()" :disabled="classes.length >= 9" class="btn-secondary text-xs flex-1 disabled:opacity-50">+ Class</button>
            <button @click="current = 0" class="btn-secondary text-xs flex-1"
                    :class="current === 0 && 'ring-1 ring-indigo-500'" title="Eraser (E)">Eraser</button>
          </div>
        </div>

        <label class="flex flex-col gap-1">
          <span class="text-xs text-gray-400 flex justify-between">Brush <span class="tabular-nums" x-text="brush + ' px'"></span></span>
          <input type="range" min="1" max="80" x-model.number="brush" class="accent-indigo-500" />
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-xs text-gray-400 flex justify-between">Overlay <span class="tabular-nums" x-text="opacity + '%'"></span></span>
          <input type="range" min="10" max="100" x-model.number="opacity" class="accent-indigo-500" />
        </label>
        <div class="flex gap-2">
          <button @click="undo()" :disabled="!undoStack.length" class="btn-secondary text-xs flex-1 disabled:opacity-50" title="Ctrl+Z">Undo</button>
          <button @click="clear()" class="btn-secondary text-xs flex-1">Clear</button>
        </div>
        <p class="text-[11px] text-gray-600">Keys: 1-9 class · E eraser · [ ] brush · Ctrl+Z undo</p>

        <div class="flex flex-col gap-1.5 border-t border-gray-800 pt-4">
          <span class="text-xs font-semibold text-gray-400 uppercase tracking-wide">Label set</span>
          <input type="text" x-model="name" maxlength="80" placeholder="Name"
                 class="bg-gray-950 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-gray-100 focus:outline-none focus:border-indigo-500" />
          <template x-if="annotations.length > 1 || (annotations.length && !annotationId)">
            <select @change="pick(annotations.find(a => a.annotation_id === $event.target.value))"
                    class="bg-gray-950 border border-gray-700 rounded-lg px-2 py-1.5 text-xs text-gray-100">
              <option value="" :selected="!annotationId">(new, unsaved)</option>
              <template x-for="a in annotations" :key="a.annotation_id">
                <option :value="a.annotation_id" :selected="a.annotation_id === annotationId" x-text="a.name"></option>
              </template>
            </select>
          </template>
          <p class="text-[11px] text-gray-600" x-show="annotations.length">
            <code class="font-mono">load_labels</code> with an empty id uses the most recently saved set.
          </p>
          <div class="flex gap-2">
            <button @click="save()" :disabled="saving" class="btn-primary text-xs flex-1 disabled:opacity-50"
                    x-text="saving ? 'Saving...' : (annotationId ? 'Save' : 'Save new')"></button>
            <button @click="newAnnotation()" class="btn-secondary text-xs" title="Start an empty label set">New</button>
          </div>
          <button x-show="annotationId" @click="remove()" class="text-xs text-gray-500 hover:text-red-400 self-start">Delete this label set</button>
          <p x-show="error" x-text="error" class="text-xs text-red-400"></p>
          <p x-show="dirty" class="text-[11px] text-amber-400">Unsaved changes</p>
          <p class="text-[11px] text-gray-600 font-mono" x-show="annotationId" x-text="'id ' + annotationId"></p>
        </div>
      </div>
    </div>
  </div>
</div>
