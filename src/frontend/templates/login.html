{% extends "base.html" %}

{% block title %}Sign in — Photon{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-950 px-4"
     x-data="loginPage()">

  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-8">
      <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="Photon" class="h-10 w-auto mb-3" />
      <p class="text-sm text-gray-500">AI-Powered Image Processing</p>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl">
      <!-- Tab toggle -->
      <div class="flex bg-gray-800 rounded-lg p-1 mb-5 text-sm font-medium">
        <button type="button" @click="mode = 'login'"
                :class="mode === 'login' ? 'bg-indigo-600 text-white' : 'text-gray-400 hover:text-gray-200'"
                class="flex-1 py-1.5 rounded-md transition-colors">Log in</button>
        <button type="button" @click="mode = 'signup'"
                :class="mode === 'signup' ? 'bg-indigo-600 text-white' : 'text-gray-400 hover:text-gray-200'"
                class="flex-1 py-1.5 rounded-md transition-colors">Sign up</button>
      </div>

      <template x-if="error">
        <div class="mb-4 px-3 py-2 bg-red-900/20 border border-red-500/20 rounded-lg text-sm text-red-400" x-text="error"></div>
      </template>

      <!-- Login form -->
      <form x-show="mode === 'login'" @submit.prevent="login()" class="space-y-3">
        <input type="text" x-model="loginId" placeholder="Username or email" required
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500" />
        <input type="password" x-model="loginPassword" placeholder="Password" required
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500" />
        <button type="submit" :disabled="submitting" class="btn-primary w-full py-2 disabled:opacity-50">
          <span x-show="!submitting">Log in</span>
          <span x-show="submitting">Logging in…</span>
        </button>
      </form>

      <!-- Signup form -->
      <form x-show="mode === 'signup'" @submit.prevent="signup()" class="space-y-3">
        <input type="text" x-model="signupUsername" placeholder="Username" required
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500" />
        <input type="email" x-model="signupEmail" placeholder="Email" required
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500" />
        <input type="password" x-model="signupPassword" placeholder="Password (min 8 characters)" required minlength="8"
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500" />
        <button type="submit" :disabled="submitting" class="btn-primary w-full py-2 disabled:opacity-50">
          <span x-show="!submitting">Create account</span>
          <span x-show="submitting">Creating…</span>
        </button>
      </form>

      {% if google_oauth_enabled %}
      <div class="flex items-center gap-3 my-5">
        <div class="flex-1 h-px bg-gray-800"></div>
        <span class="text-xs text-gray-500">or</span>
        <div class="flex-1 h-px bg-gray-800"></div>
      </div>
      <a href="/auth/login/google" class="btn-secondary w-full py-2 flex items-center justify-center gap-2">
        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Sign in with Google
      </a>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function loginPage() {
  return {
    mode: 'login',
    loginId: '', loginPassword: '',
    signupUsername: '', signupEmail: '', signupPassword: '',
    submitting: false,
    error: null,

    async login() {
      this.submitting = true;
      this.error = null;
      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username_or_email: this.loginId, password: this.loginPassword}),
        });
        const data = await res.json();
        if (!res.ok) { this.error = data.error || 'Login failed'; return; }
        window.location.href = '/';
      } catch (e) {
        this.error = e.message;
      } finally {
        this.submitting = false;
      }
    },

    async signup() {
      this.submitting = true;
      this.error = null;
      try {
        const res = await fetch('/auth/signup', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            username: this.signupUsername,
            email: this.signupEmail,
            password: this.signupPassword,
          }),
        });
        const data = await res.json();
        if (!res.ok) { this.error = data.error || 'Signup failed'; return; }
        window.location.href = '/';
      } catch (e) {
        this.error = e.message;
      } finally {
        this.submitting = false;
      }
    },
  };
}
</script>
{% endblock %}
